[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quickstatements3"
version = "3.0.0"
description = "Tool for making bulk edits to Wikidata and other Wikibase instances"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "Django==5.0.9",
    "requests==2.32.3",
    "requests-mock==1.10.0",
    "Authlib==1.3.1",
    "python-dotenv==1.0.1",
    "djangorestframework==3.15.2",
    "markdown==3.7",  # Markdown support for the browsable API.
    "django-filter==24.3",
    "jsonpatch==1.33",
    "mysqlclient==2.2.7",
    "factory_boy",
    "polib",
    "drf-spectacular",
    "drf-spectacular-sidecar",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "pytest-env",
    "pytest-watch",
    "ipython",
]

[project.urls]
Homepage = "https://qs-dev.toolforge.org/"
Documentation = "https://meta.wikimedia.org/wiki/QuickStatements_3.0/Documentation"
Repository = "https://github.com/wikimediabrasil/quickstatements3"
Issues = "https://github.com/wikimediabrasil/quickstatements3/issues"

[tool.setuptools]
# The application runs from `src/` and is not installed as a package;
# installing the project only installs its dependencies.
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "qsts3.settings"
python_files = ["tests.py", "test_*.py"]
env = [
    "DEFAULT_WIKIBASE_URL=https://wikidata.example.org",
    "OAUTH_AUTHORIZATION_SERVER=https://oauth.example.org",
    "WHITELISTED_USERS=",
]

[tool.ruff]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99
